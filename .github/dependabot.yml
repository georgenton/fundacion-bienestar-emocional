version: 2

# These jobs propose reviewed PRs; they do not enable automatic merging.
# Limits apply to version-update PRs; security updates use GitHub's own limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The root pnpm lockfile and workspace definition cover the monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Dependabot discovers both api.Dockerfile and web.Dockerfile here.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
