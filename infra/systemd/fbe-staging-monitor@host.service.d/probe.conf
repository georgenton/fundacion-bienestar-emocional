[Service]
# The backup state and Docker filesystem path are private to root on the staging host.
DynamicUser=no
ExecStart=
ExecStart=/usr/bin/python3 /opt/fbe-staging/scripts/devops/staging-monitor.py --state /var/lib/fbe-staging-monitor-host/state.json --transport /opt/fbe-staging/scripts/devops/staging-graph-mail.py host /var/lib/docker 6291456 500000 /var/lib/fbe-staging-backup/status.json
