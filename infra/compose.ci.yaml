# Disposable CI resources only. COMPOSE_PROJECT_NAME is unique for every job.
services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?CI environment is required}
      POSTGRES_USER: ${POSTGRES_USER:?CI environment is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?CI environment is required}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql

  migrate:
    image: ${FBE_MIGRATE_IMAGE:-fbe-ci-migrate:local}
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?CI environment is required}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${FBE_API_IMAGE:-fbe-ci-api:local}
    environment:
      NODE_ENV: production
      APP_ENV: test
      APP_NAME: FBE-CI-Synthetic
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?CI environment is required}
      AUTH_RESET_TOKEN_TTL_SECONDS: 900
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?CI environment is required}
      ALLOW_SYNTHETIC_SEED: "false"
      SYNTHETIC_DATA_ONLY: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${FBE_WEB_IMAGE:-fbe-ci-web:local}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
